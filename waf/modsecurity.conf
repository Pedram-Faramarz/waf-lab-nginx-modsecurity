# waf/modsecurity.conf (Windows-safe, quick-start)

SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off

# Disable file writes at startup by sending logs to /dev/null
SecAuditEngine RelevantOnly
SecAuditLog /dev/null
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial

# Send debug to /dev/null to avoid file creation problems on Windows
SecDebugLog /dev/null
SecDebugLogLevel 0

# Use CRS included in the container if present (Optional include avoids fatal error)
# IncludeOptional /usr/local/owasp-crs/crs-setup.conf
# IncludeOptional /usr/local/owasp-crs/rules/*.conf
